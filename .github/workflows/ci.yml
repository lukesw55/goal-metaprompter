name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.14"

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type-check
        run: mypy src
      - name: Test with coverage
        shell: bash
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report
      - name: Build distributions
        run: python -m build
      - name: Check distribution metadata
        shell: bash
        run: pipx run twine check dist/*
      - name: Smoke-test built wheel
        shell: bash
        run: |
          python -m pip install --force-reinstall dist/*.whl
          goal-metaprompter --version
          goal-metaprompter meta --target codex --prompt "smoke" --output smoke.md
          grep -q "SYSTEM SKILL" smoke.md
          python -c "import goal_metaprompter as g; g.get_goal_spec_schema(); g.get_metaprompt_template()"
